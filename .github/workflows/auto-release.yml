# Cuts a release on every push to main: git-cliff derives the next version
# from the Conventional Commits since the last tag, this workflow commits it
# to Cargo.toml/Cargo.lock/CHANGELOG.md, tags it and dispatches dist's
# release.yml for that tag. On pull requests it only previews the release.
# See RELEASING.md.
name: Auto release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (X.Y.Z) instead of the computed one"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    name: Preview next release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-release-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Write preview to job summary
        run: |
          version="$(git cliff --bumped-version)"
          {
            echo "Merging this pull request releases **${version}**."
            echo
            git cliff --unreleased --tag "${version}" --strip header
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      # Check out main itself rather than the pushed SHA, so a run queued
      # behind another one starts from that run's release commit.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2,cargo-edit@0.13.13

      - name: Determine version
        id: version
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$OVERRIDE" ]; then
            version="${OVERRIDE#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be X.Y.Z, got '$OVERRIDE'"
              exit 1
            fi
          elif [ -n "$last_tag" ] && [ "$(git rev-list --count "${last_tag}..HEAD")" -eq 0 ]; then
            echo "No commits since ${last_tag}; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            version="$(git cliff --bumped-version)"
            version="${version#v}"
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists"
            exit 1
          fi
          echo "Releasing v${version} (previous: ${last_tag:-none})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo set-version "$VERSION"
          cargo update --workspace
          git cliff --tag "v${VERSION}" -o CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"

      # A tag pushed with GITHUB_TOKEN doesn't trigger workflows, but a
      # workflow_dispatch does, so dist's release.yml is started explicitly.
      - name: Start release workflow
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "v${VERSION}" -f tag="v${VERSION}"
