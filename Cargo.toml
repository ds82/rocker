[package]
name = "rocker-tui"
version = "0.1.0"
edition = "2021"
description = "A vim-inspired terminal UI for Docker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ds82/rocker"
homepage = "https://github.com/ds82/rocker"
readme = "README.md"
keywords = ["docker", "tui", "vim", "terminal", "containers"]
categories = ["command-line-utilities"]
exclude = ["/.github/", "/openspec/", "/AGENTS.md", "/CONTEXT.md"]

[[bin]]
name = "rocker"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
bollard = "0.21"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
