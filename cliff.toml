# git-cliff config: computes the next version from Conventional Commits and
# renders CHANGELOG.md. Used by .github/workflows/auto-release.yml.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to rocker are documented here. This file is generated
from the commit history by git-cliff on every release; don't edit it by hand.
"""
# Headings are `## [X.Y.Z] - YYYY-MM-DD` so dist can find a version's section
# and use it as the GitHub Release notes.
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Non-conventional commits stay in the changelog and count as a patch bump.
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
# The HTML comments only order the groups; striptags removes them on render.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge (pull request|branch|remote-tracking branch) ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs?", group = "<!-- 3 -->Documentation" },
  { message = ".*", group = "<!-- 9 -->Miscellaneous" },
]

[bump]
# While rocker is 0.x: feat and breaking changes bump the minor version,
# everything else the patch version. From 1.0.0 on, plain semver applies.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
